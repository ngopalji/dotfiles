# herdr config, keybindings mirror ~/.tmux.conf
# All options + defaults: `herdr --default-config`
# Apply changes: prefix+r (or `herdr server reload-config`)

onboarding = false

[theme]
name = "gruvbox"                   # matches Ghostty's Gruvbox Dark

[theme.custom]
accent = "#71d674"                 # focused pane border + herdr's popups

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true }],
  ["pane", "workspace", "agent"],
]

[keys]
prefix = "ctrl+s"                  # same prefix as tmux
reload_config = "prefix+r"         # tmux: bind r source-file

# Panes
focus_pane_left  = ["prefix+h", "ctrl+h"]   # tmux: C-hjkl
focus_pane_down  = ["prefix+j", "ctrl+j"]
focus_pane_up    = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
resize_pane_left  = "alt+h"        # left option; needs Ghostty macos-option-as-alt = left
resize_pane_down  = "alt+j"
resize_pane_up    = "alt+k"
resize_pane_right = "alt+l"
resize_mode = "prefix+shift+r"     # hjkl resize until esc (default was prefix+r)
split_vertical = "prefix+|"        # tmux: | splits right (default prefix+v)
split_horizontal = "prefix+minus"  # tmux: - splits down
zoom = "prefix+m"                  # tmux: bind m resize-pane -Z (default prefix+z)

# Agents
open_notification_target = "prefix+a"   # jump to agent needing attention (default prefix+o)
focus_agent = "prefix+1..9"             # Nth agent in the sidebar
next_agent     = "ctrl+shift+j"         # walk the agent list without the prefix (unbound by default)
previous_agent = "ctrl+shift+k"
switch_tab = ""                         # default prefix+1..9, taken by focus_agent

# Workspaces
goto = "prefix+g"                       # built-in picker
navigate_workspace_down = "j"           # prefix+w navigate mode (default arrows)
navigate_workspace_up   = "k"
navigate_pane_left  = "ctrl+h"          # default hjkl
navigate_pane_down  = "ctrl+j"
navigate_pane_up    = "ctrl+k"
navigate_pane_right = "ctrl+l"

[[keys.command]]
key = "prefix+o"                   # tmux: sesh picker
type = "popup"
command = "~/.config/herdr/scripts/herdr-picker"
description = "picker: workspaces + agents"
width = "60%"
height = "50%"
