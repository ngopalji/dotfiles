set -g prefix C-s
unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g status-position top

# Truecolor passthrough; without it tmux downsamples to 256 colors and
# truecolor TUIs look washed out
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Splits open in the current directory
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# prefix+hjkl resizes, prefix+m zooms
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# C-hjkl moves between tmux panes and Vim splits alike (vim-tmux-navigator)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# sesh session picker on prefix+o. In the picker: ^d kills the highlighted
# session, ^t/^g/^x filter to tmux/configs/zoxide, ^a shows all.
set -g detach-on-destroy off  # killing a session hops to the next one instead of detaching
bind o run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --color 'border:#00bfff' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-n:print-query' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
bind L run-shell "sesh last"
bind N run-shell "sesh connect notes"

# Cheat sheet popup (~/.tmux-cheatsheet.py); any key closes it
bind i display-popup -w 104 -h 38 -b rounded -S "fg=#00bfff" -E "python3 ~/.tmux-cheatsheet.py"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # restore sessions after a reboot
set -g @plugin 'tmux-plugins/tmux-continuum'  # autosave every 15 minutes

set -g @smooth-scroll-speed 50
set -g @smooth-scroll-easing 'sine'
set -g @themepack 'powerline/default/cyan'

# Scrollback capture off: with ~90 panes it froze the server for ~30s on every
# autosave. Layout, cwd and programs still restore. pgrep avoids a full process
# scan per pane, the rest of the freeze.
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-save-command-strategy 'pgrep'
set -g @continuum-restore 'on'
# resurrect's default save key (prefix+C-s) collides with the prefix. prefix+S
# does a manual full save including scrollback; slow, so autosaves stay light.
set -g @resurrect-save 'M-F12'
bind S run-shell 'tmux set -g @resurrect-capture-pane-contents on; \
  ~/.tmux/plugins/tmux-resurrect/scripts/save.sh; \
  tmux set -g @resurrect-capture-pane-contents off'

run '~/.tmux/plugins/tpm/tpm'  # keep below every @plugin line

# Overrides that have to come after the plugins load
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down
set -g pane-border-lines heavy
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=brightgreen
